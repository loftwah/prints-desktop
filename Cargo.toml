[package]
name = "prints-desktop"
version = "0.6.1"
edition = "2024"
license = "MIT"

[features]
default = ["oyster-reader"]
oyster-reader = ["dep:base64", "dep:reqwest", "dep:rpassword", "dep:serde", "dep:serde_json", "dep:url"]

[[example]]
name = "oyster-reader"
required-features = ["oyster-reader"]

[dependencies]
getrandom = "0.4"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
rpassword = { version = "7", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
rune = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968", features = ["native-file-dialog", "tooling"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
naga = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
winit = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "e725e066548688ad1bb1f38ce64ae73f06ec0968" }

[profile.dev]
debug = 0
