name: Report a bug
description: Tell us what happened in the desktop app, on a platform, or in a guide.
body:
  - type: input
    id: environment
    attributes:
      label: Version and platform
      description: For example, v0.4.0 on macOS 26, Apple Silicon, or main at a commit.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Start with the shelf or screen you were using. For a guide, add its title or link.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What did you expect, and what happened?
      description: Include a public-safe screenshot or the exact error if it helps. Keep keys, private artwork, and local file paths out of the report.
    validations:
      required: true
  - type: textarea
    id: connection_report
    attributes:
      label: Connection report (optional)
      description: Paste the report copied with **Copy connection report** from the Connect Prints or library screen. Review it first: it holds typed operation, platform, duration and opaque trail IDs, never keys, headers, bodies, paths, host, Computer, installation, artwork or prompts.
    validations:
      required: false
